<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class ="parent-grid">
        <nav class="nav-bar">
            <section class="main-nav">
            <article class="nav-brand">CU Endurence Racing</article>
            <button class="nav-toggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="https://lucabarone015.github.io/wa/wa8">Home</a></li>
                <li><a href="#race">Race Info</a></li>
                <li><a href="https://lucabarone015.github.io/wa/wa8/qualifying.html">Qualifying</a></li>

            </ul>
            </section>
            <ul class = "nav-burger-menu">
                <li><a href="https://lucabarone015.github.io/wa/wa8">Home</a></li>
                <li><a href="#race">Race Info</a></li>
                <li><a href="https://lucabarone015.github.io/wa/wa8/qualifying.html">Qualifying</a></li>

                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <section class="body">
            <section class="gallery-content-grid">
                <div class="box" id="titlebox">
                    <div class="image-container">
                        <img src="img/cubrt1.jpg" alt="Racing pic">
                        <h1 class="overlay-text">Gallery</h1>
                    </div>
                </div>
                <div class="box gallery-display-grid">
                    <div class="gallery-pic">
                        <p>*click images to expand</p>
                        <img src="img/gallery1.JPG" alt="303 overtake at Wakins Glen">
                    </div>
                    <div class="gallery-pic">
                        <img src="img/gallery2.JPG" alt="303 through the turns at Wakins Glen">
                    </div>
                    <div class="gallery-pic">
                        <img src="img/gallery3.JPG" alt="303 in the pack at Wakins Glen">
                    </div>
                    <div class="gallery-pic">
                        <img src="img/gallery10.jpg" alt="303 Driver cockpit at Harris Hills">
                    </div>
                    <div class="gallery-pic">
                        <img src="img/gallery5.jpg" alt="303 Right after the start at Harris Hills ">
                    </div>
                    <div class="gallery-pic">
                        <img src="img/gallery6.jpg" alt="303 Wheel to wheel at Harris Hills">
                    </div>
                    <div class="gallery-pic">
                        <img src="img/gallery7.jpg" alt="303 Cloudy morning at Harris Hills">
                    </div>
                    <div class="gallery-pic">
                        <img src="img/gallery8.jpg" alt="303 Driver in the mirror">
                    </div>
                </div>
                <div src="" id="image-modal" class="modal" alt="close">
                    <span class="close">&times;</span>
                    <img class="modal-content" id="modal-img">
                    <div id="modal-caption"></div>
                </div>
            </section>
        </section>

    </main>


    <script src="script.js" defer></script>

</html>
