<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: flex;
            text-align: center;
            justify-content: center;
            align-items: center;
            height:250px;
            width:250px;
            border:5px black solid;
            border-radius: 100%;
            background-color:rgb(160, 0, 0);
            font-size: 32px;
            font-weight: 600;
            font-family: 'Courier New', Courier, monospace;
            transition-property: width height background-color;
            transition-duration: 3s;
            position: relative;
        }
        .box2{
            display: flex;
            height:250px;
            width:250px;
            border:5px black solid;
            background-color:blue;
            transition-property: width;
            transition-duration: 1s;
            position: relative;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box:hover {
            width:500px;
            height:500px;
            background-color: red;
        }
        .box2:hover {
            width:500px;
        }
    </style>
</head>
<body>
    <div class="box">
        Do not press
    </div>
    <div class="box2">
    </div>
</body>
</html>
