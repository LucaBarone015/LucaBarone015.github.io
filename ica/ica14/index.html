<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #424242;
        overflow: hidden;
        }

        .loader {
        position: relative;

        width: 200px;
        height: 200px;
        z-index: -1;
        animation: semicircle 4s infinite;
        }

        @keyframes semicircle {
        0% {
            transform: rotate(360deg);
        }
        50% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
        }

        .loader::before {
        content: "";
        position: absolute;
        width: 200px;
        height: 100px;
        background: #6d6d6d;
        border-bottom-left-radius: 100px;
        border-bottom-right-radius: 100px;
        bottom: 0;
        }

        .container {
        position: relative;
        transform: translateY(-100px);
        }

        .container::before {
        content: "";
        position: absolute;
        width: 200px;
        height: 200px;
        background: #7d7d7d;
        border-radius: 50%;
        top: 200px;
        animation: animateCircle 4s infinite;
        }

        @keyframes animateCircle {
        0% {
            transform: translateX(30px);
        }
        50% {
            transform: translateX(-30px);
        }
        100% {
            transform: translateX(30px);
        }
        }

        .container::after {
        content: "";
        position: absolute;
        width: 800px;
        height: 800px;
        background: #c2c2c2;
        border-radius: 50%;
        left: 50%;
        transform: translateX(-50%);
        top: 400px;
        }

        .ball {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #ffffff;
        border-radius: 50%;
        top: 50%;
        transform: translateY(-100%) translateX(4px);
        animation: animateBall 4s infinite;
        }

        @keyframes animateBall {
        0% {
            transform: translateY(-100%) translateX(-40px);
        }
        50% {
            transform: translateY(-100%) translateX(200px);
        }
        100% {
            transform: translateY(-100%) translateX(-40px);
        }
        }
    </style>
</head>
 <body>
    <div class="container">
      <div class="loader">
        <div class="ball"></div>
      </div>
    </div>
  </body>
</html>
